name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "studyonpc/**"
      - "studyonpc.py"
      - "StudyOnPC.spec"
      - "build_exe.ps1"
      - "requirements.txt"
      - "config.example.json"
      - "data/banks/**"
      - "assets/**"
      - "scripts/**"
      - "install.ps1"
      - "uninstall.ps1"
      - "parent_quit.ps1"
      - "start.bat"
      - "start-console.bat"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install -U pyinstaller

      - name: Build onedir package
        shell: pwsh
        env:
          # Keep dist inside the workspace for artifact upload
          STUDYONPC_DIST: ${{ github.workspace }}\StudyOnPC-dist
        run: |
          # No config.json in CI — build_exe.ps1 seeds from config.example.json
          if (Test-Path config.json) { throw 'config.json must not be present in CI checkout' }
          powershell -ExecutionPolicy Bypass -File .\build_exe.ps1
          $exe = Join-Path $env:STUDYONPC_DIST 'StudyOnPC.exe'
          if (-not (Test-Path $exe)) { throw "Missing built exe: $exe" }
          Get-Item $exe | Format-List FullName, Length, LastWriteTime

      - name: Upload StudyOnPC-dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyOnPC-windows-onedir
          path: StudyOnPC-dist/**
          if-no-files-found: error
          retention-days: 30
