name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install -U pyinstaller

      - name: Build onefile exe
        shell: pwsh
        env:
          STUDYONPC_DIST: ${{ github.workspace }}\StudyOnPC-dist
        run: |
          if (Test-Path config.json) { throw 'config.json must not be present in CI checkout' }
          powershell -ExecutionPolicy Bypass -File .\build_exe.ps1
          $exe = Join-Path $env:STUDYONPC_DIST 'StudyOnPC.exe'
          if (-not (Test-Path $exe)) { throw "Missing built exe: $exe" }
          $item = Get-Item $exe
          Write-Host ("Built {0} ({1:N0} bytes)" -f $item.FullName, $item.Length)
          if (Test-Path (Join-Path $env:STUDYONPC_DIST '_internal')) {
            throw 'Unexpected _internal folder — build still looks like onedir'
          }

      - name: Upload StudyOnPC.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyOnPC-windows-onefile
          path: StudyOnPC-dist/StudyOnPC.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StudyOnPC-dist/StudyOnPC.exe
          name: StudyOnPC ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 下载

            附件 **StudyOnPC.exe** 为 Windows **单文件** 包（PyInstaller onefile）。

            ## 使用说明

            1. 下载 `StudyOnPC.exe` 放到任意目录后双击运行
            2. **首次运行**会在 exe 同目录自动生成 `config.json`、`data\`、`logs\` 等
            3. 请立即修改 `config.json` 里的 `parent_pin` / `admin_password`（默认仅为占位）
            4. 开机启动等辅助脚本见仓库源码（`install.ps1` 等），按需拷到 exe 旁使用

            > 冷启动会解压到临时目录，略慢于文件夹版；日常只需分发这一个 exe。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
