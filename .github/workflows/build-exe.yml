name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "studyonpc/**"
      - "studyonpc.py"
      - "StudyOnPC.spec"
      - "build_exe.ps1"
      - "requirements.txt"
      - "config.example.json"
      - "data/banks/**"
      - "assets/**"
      - "scripts/**"
      - "install.ps1"
      - "uninstall.ps1"
      - "parent_quit.ps1"
      - "start.bat"
      - "start-console.bat"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install -U pyinstaller

      - name: Build onefile exe
        shell: pwsh
        env:
          STUDYONPC_DIST: ${{ github.workspace }}\StudyOnPC-dist
        run: |
          if (Test-Path config.json) { throw 'config.json must not be present in CI checkout' }
          powershell -ExecutionPolicy Bypass -File .\build_exe.ps1
          $exe = Join-Path $env:STUDYONPC_DIST 'StudyOnPC.exe'
          if (-not (Test-Path $exe)) { throw "Missing built exe: $exe" }
          $item = Get-Item $exe
          Write-Host ("Built {0} ({1:N0} bytes)" -f $item.FullName, $item.Length)
          # Guard: onefile should not ship an _internal folder
          if (Test-Path (Join-Path $env:STUDYONPC_DIST '_internal')) {
            throw 'Unexpected _internal folder — build still looks like onedir'
          }

      - name: Upload StudyOnPC.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyOnPC-windows-onefile
          path: StudyOnPC-dist/StudyOnPC.exe
          if-no-files-found: error
          retention-days: 30
